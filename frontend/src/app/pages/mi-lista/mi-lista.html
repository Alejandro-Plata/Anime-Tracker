<main class="page">

    <header class="page-head">
        <h1>Mi lista</h1>
        <p>Tus series, con su estado.</p>
    </header>

    <nav class="tab-row" aria-label="Filtrar por estado">
        <button type="button" [class.active]="activeTab === 'TODOS'" (click)="setTab('TODOS')">
            Todos <b>{{ favoritesAnime.length }}</b>
        </button>
        <button type="button" [class.active]="activeTab === 'VIENDO'" (click)="setTab('VIENDO')">
            Viendo <b>{{ getCountByStatus('VIENDO') }}</b>
        </button>
        <button type="button" [class.active]="activeTab === 'FINALIZADO'" (click)="setTab('FINALIZADO')">
            Finalizados <b>{{ getCountByStatus('FINALIZADO') }}</b>
        </button>
        <button type="button" [class.active]="activeTab === 'PENDIENTE'" (click)="setTab('PENDIENTE')">
            Pendientes <b>{{ getCountByStatus('PENDIENTE') }}</b>
        </button>
        <button type="button" [class.active]="activeTab === 'ABANDONADO'" (click)="setTab('ABANDONADO')">
            Abandonados <b>{{ getCountByStatus('ABANDONADO') }}</b>
        </button>
    </nav>

    <section class="poster-grid list" aria-live="polite">
        @for (anime of favoritesShow; track anime.detalles.mal_id) {
        <app-card [anime]="aAnime(anime)" [animeId]="anime.detalles.mal_id" [state]="anime.state"
            [genres]="generos(anime)"></app-card>
        }
    </section>

    @if (favoritesShow.length === 0) {
    <div class="state-msg">
        <p>No hay animes en esta categoría.</p>
        <a class="pill pill-line" routerLink="/dashboard">Explora y añade series</a>
    </div>
    }

</main>
