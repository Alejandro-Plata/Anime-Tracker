<div class="search-page-container">

    <!-- CABECERA DE LA SECCIÓN -->
    <header class="search-header">
        <h1 class="page-title">Brújula de Búsqueda</h1>
        <p class="page-subtitle">Ajusta los parámetros del artefacto para filtrar las corrientes del tiempo.</p>
        <div class="header-divider-gold"></div>
    </header>

    <!-- ARTEFACTO DE BÚSQUEDA (Formulario) -->
    <form class="kairo-artifact-form">

        <!-- 1. BARRA DE BÚSQUEDA PRINCIPAL -->
        <div class="form-group full-width">
            <label for="query" class="kairo-label">Nombre del Tesoro (Título)</label>
            <div class="input-wrapper-icon">
                <input type="text" id="query" placeholder="Ej: Fullmetal Alchemist..." class="kairo-input-main">
                <span class="input-icon">🔍</span>
            </div>
        </div>

        <!-- 2. FILTROS PRINCIPALES (Grid) -->
        <div class="filters-grid">

            <!-- Tipo -->
            <div class="form-group">
                <label for="type" class="kairo-label">Formato</label>
                <div class="kairo-select-wrapper">
                    <select id="type" class="kairo-select">
                        <option value="">Cualquiera</option>
                        <option value="tv">Serie TV</option>
                        <option value="movie">Película</option>
                        <option value="ova">OVA</option>
                        <option value="special">Especial</option>
                        <option value="ona">ONA</option>
                        <option value="music">Música</option>
                    </select>
                </div>
            </div>

            <!-- Estado -->
            <div class="form-group">
                <label for="status" class="kairo-label">Estado</label>
                <div class="kairo-select-wrapper">
                    <select id="status" class="kairo-select">
                        <option value="">Cualquiera</option>
                        <option value="airing">En Emisión</option>
                        <option value="complete">Finalizado</option>
                        <option value="upcoming">Próximamente</option>
                    </select>
                </div>
            </div>

            <!-- Clasificación (Rating) -->
            <div class="form-group">
                <label for="rating" class="kairo-label">Restricción</label>
                <div class="kairo-select-wrapper">
                    <select id="rating" class="kairo-select">
                        <option value="">Todas</option>
                        <option value="g">G (Todo Público)</option>
                        <option value="pg">PG (Niños)</option>
                        <option value="pg13">PG-13 (Adolescentes)</option>
                        <option value="r17">R-17+ (Violencia/Profanidad)</option>
                        <option value="r">R+ (Desnudez leve)</option>
                    </select>
                </div>
            </div>

            <!-- Ordenar Por -->
            <div class="form-group">
                <label for="order_by" class="kairo-label">Ordenar Hallazgos</label>
                <div class="kairo-select-wrapper">
                    <select id="order_by" class="kairo-select">
                        <option value="popularity">Más Populares</option>
                        <option value="score">Mejor Valorados</option>
                        <option value="start_date">Fecha de Estreno</option>
                        <option value="title">Alfabético</option>
                        <option value="episodes">Duración (Eps)</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- 3. RANGO DE PUNTUACIÓN (Score) -->
        <div class="form-section-divider">
            <span class="divider-label">Calidad Mínima</span>
            <div class="line"></div>
        </div>

        <div class="score-slider-container">
            <div class="slider-labels">
                <span>1 (Basura)</span>
                <span id="score-val" class="score-display">Puntuación: 7+</span>
                <span>10 (Obra Maestra)</span>
            </div>
            <input type="range" min="1" max="10" step="1" value="7" class="kairo-range">
        </div>

        <!-- 4. SELECTOR DE GÉNEROS (Runas) -->
        <div class="form-section-divider">
            <span class="divider-label">Esencia (Géneros)</span>
            <div class="line"></div>
        </div>

        <div class="genres-grid">
            <!-- Checkbox Hack para botones seleccionables -->
            <label class="genre-rune">
                <input type="checkbox" value="1">
                <span class="rune-face">Acción</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="2">
                <span class="rune-face">Aventura</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="4">
                <span class="rune-face">Comedia</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="8">
                <span class="rune-face">Drama</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="10">
                <span class="rune-face">Fantasía</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="14">
                <span class="rune-face">Terror</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="7">
                <span class="rune-face">Misterio</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="22">
                <span class="rune-face">Romance</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="24">
                <span class="rune-face">Sci-Fi</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="36">
                <span class="rune-face">Slice of Life</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="30">
                <span class="rune-face">Deportes</span>
            </label>
            <label class="genre-rune">
                <input type="checkbox" value="37">
                <span class="rune-face">Sobrenatural</span>
            </label>
        </div>

        <!-- 5. BOTONES DE ACCIÓN -->
        <div class="form-actions">
            <button type="button" class="btn-reset">Limpiar Tablero</button>
            <button type="submit" class="btn-invoke">
                <span class="btn-text">Invocar Búsqueda</span>
                <div class="btn-glow"></div>
            </button>
        </div>

    </form>
</div>
