<main class="login-layout">

    <!-- FONDO AMBIENTAL -->
    <div class="bg-image"></div>
    <div class="noise-overlay"></div>

    <!-- CONTENEDOR LOGIN -->
    <div class="login-container">

        <!-- TARJETA CON EFECTO CRISTAL (Glassmorphism) -->
        <div class="login-card ornate-border">

            <div class="card-header">
                <h1 class="title">Reanudar <span class="gold-text">Odisea</span></h1>
                <p class="subtitle">Ingresa tus credenciales de viajero</p>

                <!-- Adorno separador -->
                <div class="separator-ornament">
                    <span class="diamond">❖</span>
                </div>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="kairo-form">

                <!-- CAMPO CORREO -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input id="email" type="email" formControlName="email" placeholder="nombre@ejemplo.com"
                        [class.invalid]="isFieldInvalid('email')">
                    <!-- Mensaje de error -->
                    <div class="error-msg" *ngIf="isFieldInvalid('email')">
                        <span *ngIf="loginForm.get('email')?.hasError('required')">El correo es necesario.</span>
                        <span *ngIf="loginForm.get('email')?.hasError('email')">Formato inválido.</span>
                    </div>
                </div>

                <!-- CAMPO CONTRASEÑA -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿Olvidaste la llave?</a>
                    </div>

                    <input id="password" type="password" formControlName="password" placeholder="••••••••"
                        [class.invalid]="isFieldInvalid('password')">

                    <div class="error-msg" *ngIf="isFieldInvalid('password')">
                        La contraseña es requerida.
                    </div>
                </div>

                <!-- BOTÓN PRINCIPAL -->
                <div class="form-actions">
                    <button type="submit" class="btn-login" [disabled]="loginForm.invalid || isLoading">
                        <span class="btn-content" *ngIf="!isLoading">
                            Abrir Portal <span class="icon">➜</span>
                        </span>
                        <span class="loader" *ngIf="isLoading"></span>
                    </button>
                </div>

                <!-- FOOTER -->
                <div class="form-footer">
                    <p>¿Aún no tienes grimorio?</p>
                    <a href="#" class="register-link">Inscribirse en el Gremio</a>
                </div>

            </form>
        </div>
    </div>
</main>
