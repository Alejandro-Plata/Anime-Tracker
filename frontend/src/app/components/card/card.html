<article class="tile" [class.static]="!interactive" (click)="navigateToAnimeDetail()"
    [attr.tabindex]="interactive ? 0 : null" [attr.role]="interactive ? 'link' : null"
    (keydown.enter)="navigateToAnimeDetail()">
    <div class="poster">
        <img [src]="src" [alt]="'Póster de ' + anime.title" width="225" height="318" loading="lazy"
            (error)="imgError($event)">
        @if (state) {
        <span class="chip" [attr.data-estado]="state">{{ estadoLabel }}</span>
        }
        @if (anime.score) {
        <span class="score">★ {{ anime.score }}</span>
        }
    </div>
    <div class="meta">
        <h3>{{ anime.title }}</h3>
        @if (genres.length) {
        <div class="tags">
            @for (g of genres; track g) {
            <span class="tag">{{ g }}</span>
            }
        </div>
        }
    </div>
</article>
