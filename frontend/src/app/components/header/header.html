<header class="nav">
    <div class="nav-in">
        <a class="brand" routerLink="/dashboard" aria-label="Kairo, inicio">
            <img src="logo_kairo.svg" alt="" width="28" height="28">
            <span>Kairo</span>
        </a>

        <nav class="links" [class.open]="isMenuOpen" aria-label="Principal">
            <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
            <a routerLink="/dashboard/mi-lista" routerLinkActive="active">Mi lista</a>
            <a routerLink="/dashboard/buscador" routerLinkActive="active">Buscador</a>
            <a routerLink="/dashboard/descubrir" routerLinkActive="active">Descubrir</a>
        </nav>

        <div class="right">
            <div class="profile" (clickOutside)="closeProfileMenu()">
                <button type="button" class="profile-btn" (click)="toggleProfileMenu()"
                    [attr.aria-expanded]="isProfileMenuOpen" aria-haspopup="menu">
                    <span class="avatar" aria-hidden="true">{{ initial }}</span>
                    <span class="name">{{ username }}</span>
                </button>
                @if (isProfileMenuOpen) {
                <div class="menu" role="menu">
                    <button type="button" role="menuitem" (click)="logout()">Cerrar sesión</button>
                </div>
                }
            </div>

            <button type="button" class="burger" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
                aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>
